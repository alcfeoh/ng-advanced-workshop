<div class="dropdown">
  <input type="text" class="dropbtn" [formField]="textForm.text"
    [placeholder]="placeholder()" >
  <div class="dropdown-content">
    @for (entry of filteredEntries(); track entry.description) {
      <span (click)="newSelection(entry)"
        [innerHTML]="entry.description | highlight: textForm.text().value()">
      </span>
    }
  </div>
</div>
